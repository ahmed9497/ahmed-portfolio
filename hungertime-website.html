<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hunger Time – Fast Food, Kotli Loharan Chowk</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0b1f;--card:#1a1535;--ora:#ff6b1a;--lime:#c6ff3d;--txt:#f5f2ff;--mut:#a9a2cf;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;overflow-x:hidden}
h1,h2,.logo{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:1px}
button{font:inherit;cursor:pointer;border:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 5vw;background:#0e0b1fee;backdrop-filter:blur(8px)}
.logo{font-size:26px}.logo b{color:var(--ora);font-weight:400}
.links{display:flex;gap:18px;align-items:center}.links a{color:var(--txt);text-decoration:none;font-size:14px}
@media(max-width:700px){.links a{display:none}}
.cartbtn{background:var(--lime);color:#111;padding:9px 16px;border-radius:30px;font-weight:700}
section{padding:70px 5vw;max-width:1150px;margin:auto}
h2{font-size:clamp(34px,6vw,56px);margin:0 0 8px;color:var(--lime)}
.sub{color:var(--mut);margin:0 0 30px}
.hero{min-height:86vh;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}}
.hero h1{font-size:clamp(56px,11vw,120px);line-height:.95;margin:10px 0}
.hero h1 .o{color:var(--ora);display:block}
.pill{display:inline-block;background:#c6ff3d1f;border:1px solid var(--lime);color:var(--lime);padding:6px 14px;border-radius:30px;font-size:13px}
.cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}@media(max-width:800px){.cta{justify-content:center}}
.btn{background:var(--ora);color:#fff;padding:14px 26px;border-radius:40px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;border:2px solid var(--lime);color:var(--lime)}
.plate{position:relative;height:380px;display:grid;place-items:center}
.plate .big{font-size:180px;filter:drop-shadow(0 20px 30px #000)}
.plate .ring{position:absolute;width:320px;height:320px;border-radius:50%;border:3px dashed var(--ora);opacity:.45}
.fl{position:absolute;font-size:46px}
.marq{background:var(--lime);color:#111;overflow:hidden;white-space:nowrap;padding:12px 0;transform:rotate(1.2deg);margin:10px -2vw}
.marq div{display:inline-block;font-family:Anton;font-size:24px;letter-spacing:2px}
.meter{background:var(--card);border-radius:24px;padding:30px;text-align:center}
.meter input[type=range]{width:100%;accent-color:var(--ora);padding:0;background:none;border:0}
.meter .big{font-size:84px;display:block;margin:10px 0}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.tab{background:var(--card);color:var(--txt);padding:10px 18px;border-radius:30px;border:1px solid #ffffff1f;position:relative}
.tab.on{color:#111;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.item{background:var(--card);border-radius:20px;padding:20px;border:1px solid #ffffff14}
.item .em{font-size:62px;text-align:center;margin-bottom:6px}
.item h3{margin:4px 0;font-size:18px}.item p{margin:0 0 12px;color:var(--mut);font-size:13px;min-height:36px}
.row{display:flex;justify-content:space-between;align-items:center}.price{color:var(--lime);font-weight:700}
.add{background:var(--ora);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.svc div{background:var(--card);border-radius:20px;padding:24px;text-align:center;border:1px solid #ffffff14}
.svc span{font-size:44px;display:block}.svc b{display:block;margin-top:8px}.svc small{color:var(--mut)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.vid{position:relative;aspect-ratio:9/11;border-radius:22px;overflow:hidden;text-decoration:none;color:#fff;background:linear-gradient(160deg,#ff6b1a,#6a1fb5 70%,#1a1535);display:flex;flex-direction:column;justify-content:flex-end;padding:20px}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .bg{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;opacity:.35}
.vid .play{position:absolute;top:50%;left:50%;margin:-34px;width:68px;height:68px;border-radius:50%;background:#fff;color:var(--ora);display:grid;place-items:center;font-size:28px;padding-left:5px}
.vid h3{margin:0;position:relative;font-size:18px}.vid small{position:relative;color:#ffe8d6}
.loc{background:var(--card);border-radius:24px;padding:28px;border:2px solid var(--lime)}
.loc p{margin:6px 0;color:var(--mut)}.loc a{color:var(--lime)}
.rev{background:var(--card);border-radius:22px;padding:30px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.rev q{font-size:20px;display:block;max-width:560px}.stars{color:var(--lime);font-size:24px;letter-spacing:4px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}.dot{width:10px;height:10px;border-radius:50%;background:#ffffff33;padding:0}.dot.on{background:var(--lime)}
.score{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:22px}.score b{font-family:Anton;font-size:44px;color:var(--ora);display:block;line-height:1;font-weight:400}
form{display:grid;gap:12px;max-width:560px}
input,textarea,select{background:var(--card);border:1px solid #ffffff22;color:var(--txt);padding:14px;border-radius:14px;font:inherit;width:100%}
.ov{position:fixed;inset:0;background:#000a;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#150f2d;z-index:31;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.ci{display:flex;gap:10px;align-items:center;background:var(--card);padding:10px 12px;border-radius:14px}
.ci .n{flex:1;font-size:14px}.q{display:flex;gap:8px;align-items:center}.q button{width:28px;height:28px;border-radius:50%;background:#ffffff22;color:#fff}
.wa{background:#25d366;color:#04200f;padding:15px;border-radius:40px;font-weight:700;font-size:16px;width:100%}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;background:#25d366;width:58px;height:58px;border-radius:50%;font-size:28px;display:grid;place-items:center;text-decoration:none;box-shadow:0 6px 20px #000a}
.toast{position:fixed;left:50%;bottom:90px;z-index:40;background:var(--lime);color:#111;padding:10px 20px;border-radius:30px;font-weight:700;transform:translateX(-50%)}
footer{text-align:center;color:var(--mut);padding:40px 5vw 90px;font-size:13px}
</style></head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@10.18.0/dist/framer-motion.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const FM=window.Motion||window.FramerMotion||{};
const {motion,AnimatePresence,useScroll,useSpring}=FM;
const WA="923266111612";
const CATS=["Pizza","Burgers","Wraps & Wings","Pasta & Sides"];
const MENU=[
 {c:"Pizza",e:"🍕",n:"Kabab Crust Pizza",d:"Kabab-stuffed crust, loaded toppings",p:1100},
 {c:"Pizza",e:"🍕",n:"Creamy Ranch Pizza",d:"Rich ranch sauce, chicken, cheese",p:950},
 {c:"Pizza",e:"🍕",n:"Doner Pizza",d:"Doner meat, onions, mozzarella",p:1000},
 {c:"Burgers",e:"🍔",n:"Zinger Burger",d:"Crispy fillet, mayo, lettuce",p:380},
 {c:"Burgers",e:"🍔",n:"Loaded Burger",d:"Double patty, cheese, special sauce",p:520},
 {c:"Burgers",e:"🥪",n:"Loaded Sandwich",d:"Grilled, cheesy, packed with chicken",p:450},
 {c:"Wraps & Wings",e:"🌯",n:"Crunchy Wrap",d:"Crispy chicken in a toasted wrap",p:350},
 {c:"Wraps & Wings",e:"🍗",n:"Hot Wings (6 pcs)",d:"Spicy, crispy, finger-licking",p:420},
 {c:"Pasta & Sides",e:"🍝",n:"Creamy Pasta",d:"Chicken pasta in white sauce",p:500},
 {c:"Pasta & Sides",e:"🍟",n:"Loaded Fries",d:"Fries, cheese sauce, chicken bits",p:380},
 {c:"Pasta & Sides",e:"🍟",n:"Plain Fries",d:"Golden and salted",p:200}];
const REV=[
 {n:"Bilal A.",t:"The kabab crust pizza is unreal. Best in Kotli Loharan, no question."},
 {n:"Sana T.",t:"Family hall is clean and peaceful. Staff was very polite."},
 {n:"Hamza J.",t:"Drive-through at midnight, hot food in minutes. Love it!"},
 {n:"Maryam K.",t:"Creamy ranch pizza and loaded fries, quick delivery too."}];
const VIDEOS=[
 {t:"Hunger Time on Instagram",s:"@hungertime2",e:"📸",u:"https://www.instagram.com/hungertime2/"},
 {t:"Hunger Time on TikTok",s:"@hungertime2",e:"🎬",u:"https://www.tiktok.com/@hungertime2"},
 {t:"Hunger Time on Facebook",s:"Facebook page",e:"🔥",u:"https://www.facebook.com/p/Hunger-Time-100090638106214/"}];
const rs=n=>"Rs "+n.toLocaleString();
const LV=[["😌","Just peckish","Fries"],["😋","Getting hungry","Zinger Burger"],["🤤","Really hungry","Creamy Ranch Pizza"],["😫","Starving!","Kabab Crust Pizza"],["🦖","BEAST MODE","Kabab Crust Pizza"]];

function App(){
 const [cat,setCat]=useState("Pizza");
 const [cart,setCart]=useState({});
 const [open,setOpen]=useState(false);
 const [ri,setRi]=useState(0);
 const [lv,setLv]=useState(2);
 const [toast,setToast]=useState("");
 const [cust,setCust]=useState({name:"",addr:"",type:"Delivery"});
 const [msg,setMsg]=useState({n:"",m:""});
 const {scrollYProgress}=useScroll();
 const sx=useSpring(scrollYProgress,{stiffness:120,damping:20});
 useEffect(()=>{const t=setInterval(()=>setRi(i=>(i+1)%REV.length),4500);return()=>clearInterval(t)},[]);
 const add=it=>{setCart(c=>({...c,[it.n]:(c[it.n]||0)+1}));setToast(it.e+" "+it.n+" added!");setTimeout(()=>setToast(""),1400)};
 const chg=(n,d)=>setCart(c=>{const v=(c[n]||0)+d;const x={...c};if(v<=0)delete x[n];else x[n]=v;return x});
 const lines=Object.entries(cart).map(([n,q])=>({...MENU.find(m=>m.n===n),q}));
 const count=lines.reduce((a,l)=>a+l.q,0),total=lines.reduce((a,l)=>a+l.q*l.p,0);
 const rec=MENU.find(m=>m.n===LV[lv][2])||MENU[0];
 const send=()=>{
  const m="*New Order – Hunger Time*\n"+lines.map(l=>l.q+" x "+l.n+" = "+rs(l.q*l.p)).join("\n")+"\n*Total: "+rs(total)+"*\nType: "+cust.type+"\nName: "+(cust.name||"-")+"\nAddress: "+(cust.addr||"-");
  window.open("https://wa.me/"+WA+"?text="+encodeURIComponent(m),"_blank");
 };
 const fade={initial:{opacity:0,y:40},whileInView:{opacity:1,y:0},viewport:{once:true,margin:"-60px"},transition:{duration:.6}};
 return(<>
 <motion.div style={{scaleX:sx,transformOrigin:"0 0",position:"fixed",top:0,left:0,right:0,height:4,background:"var(--lime)",zIndex:50}}/>
 <nav><div className="logo">Hunger<b>Time</b></div>
  <div className="links"><a href="#menu">Menu</a><a href="#watch">Videos</a><a href="#visit">Visit</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a>
  <motion.button className="cartbtn" whileTap={{scale:.9}} onClick={()=>setOpen(true)}>🛒 Cart <motion.span key={count} initial={{scale:1.8}} animate={{scale:1}}>({count})</motion.span></motion.button></div></nav>

 <section className="hero">
  <div>
   <motion.span className="pill" initial={{opacity:0,x:-30}} animate={{opacity:1,x:0}}>⭐ 4.6 rated · Open till 2:30 AM · Kotli Loharan Chowk</motion.span>
   <h1>{["Feed","the"].map((w,i)=><motion.span key={w} style={{display:"inline-block",marginRight:14}} initial={{y:80,opacity:0}} animate={{y:0,opacity:1}} transition={{delay:.1+i*.15,type:"spring"}}>{w}</motion.span>)}
    <motion.span className="o" initial={{scale:0,rotate:-10}} animate={{scale:1,rotate:-2}} transition={{delay:.5,type:"spring",stiffness:200}}>Hunger!</motion.span></h1>
   <motion.p initial={{opacity:0}} animate={{opacity:1}} transition={{delay:.8}} style={{color:"var(--mut)",fontSize:18,maxWidth:480}}>Kabab crust pizza, creamy ranch, loaded burgers, wings and pasta. Dine-in, drive-through or delivered to your door.</motion.p>
   <div className="cta"><motion.a href="#menu" className="btn" whileHover={{scale:1.08,rotate:-2}} whileTap={{scale:.95}}>Order Now 🍕</motion.a>
   <motion.a href={"https://wa.me/"+WA} className="btn alt" whileHover={{scale:1.08}} whileTap={{scale:.95}}>WhatsApp Us</motion.a></div>
  </div>
  <div className="plate">
   <motion.div className="ring" animate={{rotate:-360}} transition={{repeat:Infinity,duration:25,ease:"linear"}}/>
   <motion.div className="big" drag dragConstraints={{left:-40,right:40,top:-40,bottom:40}} dragElastic={.4} whileTap={{scale:.9}} animate={{y:[0,-18,0],rotate:[0,-6,6,0]}} transition={{repeat:Infinity,duration:5}}>🍔</motion.div>
   {["🍕","🍟","🍗","🍝"].map((e,i)=><motion.span key={i} className="fl" style={{top:[10,60,250,300][i]+"px",left:["8%","80%","2%","75%"][i]}} animate={{y:[0,-20,0],rotate:[0,15,0]}} transition={{repeat:Infinity,duration:3+i,delay:i*.4}}>{e}</motion.span>)}
  </div>
 </section>

 <div className="marq"><motion.div animate={{x:["0%","-50%"]}} transition={{repeat:Infinity,duration:22,ease:"linear"}}>{Array(12).fill("🍕 KABAB CRUST  ✦  🍔 LOADED BURGERS  ✦  🍗 HOT WINGS  ✦  🍝 CREAMY PASTA  ✦  🚗 DRIVE-THROUGH  ✦  ").join("")}</motion.div></div>

 <section><motion.div {...fade} className="meter">
  <h2 style={{fontSize:34}}>Hunger-o-Meter</h2><p className="sub" style={{marginBottom:8}}>Slide to see what we recommend</p>
  <input type="range" min="0" max="4" value={lv} aria-label="hunger level" onChange={e=>setLv(+e.target.value)}/>
  <AnimatePresence mode="wait"><motion.div key={lv} initial={{scale:.5,opacity:0}} animate={{scale:1,opacity:1}} exit={{scale:.5,opacity:0}}>
   <span className="big">{LV[lv][0]}</span><b style={{fontSize:20}}>{LV[lv][1]}</b>
   <p className="sub" style={{margin:"6px 0 14px"}}>We suggest: {rec.e} {rec.n} · {rs(rec.p)}</p></motion.div></AnimatePresence>
  <motion.button className="btn" whileTap={{scale:.92}} onClick={()=>add(rec)}>Add to cart</motion.button></motion.div></section>

 <section id="menu"><motion.div {...fade}><h2>Our Menu</h2><p className="sub">Tap + to add to your cart. (Sample prices; edit to match the real menu.)</p></motion.div>
  <div className="tabs">{CATS.map(c=><button key={c} className={"tab"+(cat===c?" on":"")} onClick={()=>setCat(c)}>{cat===c&&<motion.span layoutId="tb" style={{position:"absolute",inset:0,background:"var(--lime)",borderRadius:30,zIndex:-1}}/>}{c}</button>)}</div>
  <motion.div className="grid" layout><AnimatePresence mode="popLayout">
   {MENU.filter(m=>m.c===cat).map(it=><motion.div layout key={it.n} className="item" initial={{opacity:0,scale:.8}} animate={{opacity:1,scale:1}} exit={{opacity:0,scale:.8}} whileHover={{y:-8,rotate:1}}>
    <motion.div className="em" whileHover={{scale:1.3,rotate:-15}}>{it.e}</motion.div><h3>{it.n}</h3><p>{it.d}</p>
    <div className="row"><span className="price">{rs(it.p)}</span><motion.button className="add" aria-label={"add "+it.n} whileTap={{scale:.7,rotate:90}} whileHover={{scale:1.15}} onClick={()=>add(it)}>+</motion.button></div></motion.div>)}
  </AnimatePresence></motion.div></section>

 <section><motion.div {...fade}><h2>Eat Your Way</h2></motion.div>
  <div className="svc">{[["🍽️","Dine-in","Separate family hall"],["🥡","Takeaway","Ready when you are"],["🚗","Drive-through","Grab and go"],["🛵","Delivery","Hot to your door"]].map(([e,t,s],i)=>
   <motion.div key={t} {...fade} transition={{delay:i*.1,duration:.5}} whileHover={{y:-8,scale:1.04}}><motion.span animate={{rotate:[0,10,-10,0]}} transition={{repeat:Infinity,duration:3,delay:i*.3}}>{e}</motion.span><b>{t}</b><small>{s}</small></motion.div>)}</div></section>

 <section id="watch"><motion.div {...fade}><h2>Watch &amp; Follow</h2><p className="sub">See our latest on Instagram, TikTok and Facebook.</p></motion.div>
  <div className="vgrid">{VIDEOS.map((v,i)=><motion.a key={i} className="vid" href={v.u} target="_blank" rel="noopener" {...fade} whileHover={{y:-8,scale:1.02}}>
   {v.src?<video src={v.src} muted loop playsInline autoPlay/>:<motion.div className="bg" animate={{scale:[1,1.15,1],rotate:[0,6,-6,0]}} transition={{repeat:Infinity,duration:6}}>{v.e}</motion.div>}
   <motion.div className="play" animate={{scale:[1,1.15,1]}} transition={{repeat:Infinity,duration:1.8}}>▶</motion.div>
   <h3>{v.t}</h3><small>{v.s} ↗</small></motion.a>)}</div></section>

 <section id="visit"><motion.div {...fade}><h2>Come Hungry</h2></motion.div>
  <motion.div {...fade} className="loc"><h3 style={{margin:0,fontSize:22}}>📍 Hunger Time, Kotli Loharan Chowk</h3>
   <p>Near PSO Pump, Kotli Loharan, Sialkot 51210</p><p>🕒 Open late, closes 2:30 AM</p><p>📞 <a href={"tel:+"+WA}>0326 6111612</a></p>
   <motion.a className="btn" style={{marginTop:12}} href="https://www.google.com/maps/search/?api=1&query=Hunger+Time+Kotli+Loharan+Chowk+Sialkot" target="_blank" rel="noopener" whileHover={{scale:1.05}}>Get Directions</motion.a></motion.div></section>

 <section id="reviews"><motion.div {...fade}><h2>Loved by Sialkot</h2></motion.div>
  <div className="score"><div><b>4.6★</b>Google rating</div><div><b>77+</b>Google reviews</div><div><b>2:30</b>AM closing</div></div>
  <div className="rev"><AnimatePresence mode="wait"><motion.div key={ri} initial={{opacity:0,x:60}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-60}}><div className="stars">★★★★★</div><q>{REV[ri].t}</q><p style={{color:"var(--lime)"}}>– {REV[ri].n}</p></motion.div></AnimatePresence></div>
  <div className="dots">{REV.map((_,i)=><button key={i} aria-label={"review "+(i+1)} className={"dot"+(i===ri?" on":"")} onClick={()=>setRi(i)}/>)}</div></section>

 <section id="contact"><motion.div {...fade}><h2>Say Hello</h2><p className="sub">Parties, bulk orders or feedback? Message goes to WhatsApp.</p></motion.div>
  <form onSubmit={e=>{e.preventDefault();window.open("https://wa.me/"+WA+"?text="+encodeURIComponent("Hi Hunger Time, I'm "+msg.n+". "+msg.m),"_blank")}}>
   <input required placeholder="Your name" value={msg.n} onChange={e=>setMsg({...msg,n:e.target.value})}/>
   <textarea required rows="4" placeholder="Your message" value={msg.m} onChange={e=>setMsg({...msg,m:e.target.value})}/>
   <motion.button className="btn" whileHover={{scale:1.04}} whileTap={{scale:.95}}>Send on WhatsApp 💬</motion.button></form></section>

 <footer><div className="logo">Hunger<b>Time</b></div>Near PSO, Kotli Loharan Chowk, Sialkot · 0326 6111612<br/>© Hunger Time. Website concept demo.</footer>

 <motion.a className="fab" href={"https://wa.me/"+WA} aria-label="WhatsApp" animate={{scale:[1,1.12,1]}} transition={{repeat:Infinity,duration:2}}>💬</motion.a>
 <AnimatePresence>{toast&&<motion.div className="toast" initial={{y:40,opacity:0}} animate={{y:0,opacity:1}} exit={{opacity:0}}>{toast}</motion.div>}</AnimatePresence>

 <AnimatePresence>{open&&<>
  <motion.div className="ov" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} onClick={()=>setOpen(false)}/>
  <motion.div className="drawer" initial={{x:"100%"}} animate={{x:0}} exit={{x:"100%"}} transition={{type:"spring",damping:28,stiffness:260}}>
   <div className="row"><h2 style={{margin:0,fontSize:34}}>Your Cart</h2><button aria-label="close" onClick={()=>setOpen(false)} style={{background:"none",color:"#fff",fontSize:26}}>✕</button></div>
   {!lines.length&&<p className="sub">Your cart is empty. Feed that hunger 🍕</p>}
   <AnimatePresence>{lines.map(l=><motion.div layout key={l.n} className="ci" initial={{opacity:0,x:40}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-40}}>
    <span style={{fontSize:30}}>{l.e}</span><div className="n">{l.n}<br/><span className="price">{rs(l.p*l.q)}</span></div>
    <div className="q"><button onClick={()=>chg(l.n,-1)}>−</button>{l.q}<button onClick={()=>chg(l.n,1)}>+</button></div></motion.div>)}</AnimatePresence>
   {!!lines.length&&<>
    <select value={cust.type} onChange={e=>setCust({...cust,type:e.target.value})}>{["Delivery","Takeaway","Dine-in","Drive-through"].map(t=><option key={t}>{t}</option>)}</select>
