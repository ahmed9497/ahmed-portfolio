<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TasteInn – Fast Food, Kotli Loharan</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#140c08;--card:#221410;--red:#e63a1e;--yel:#ffc21a;--txt:#fff4e6;--mut:#c9ad98;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Poppins,system-ui,sans-serif;overflow-x:hidden}
h1,h2,.logo{font-family:Bangers,Impact,sans-serif;letter-spacing:1.5px;font-weight:400}
button{font:inherit;cursor:pointer;border:0}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:space-between;align-items:center;padding:10px 5vw;background:#140c08ee;backdrop-filter:blur(8px)}
.logo{font-size:30px;color:var(--yel)}.logo b{color:var(--red);font-weight:400}
.links{display:flex;gap:20px;align-items:center}.links a{color:var(--txt);text-decoration:none;font-size:14px}
@media(max-width:700px){.links a{display:none}}
.cartbtn{background:var(--yel);color:#000;padding:9px 16px;border-radius:30px;font-weight:700}
section{padding:70px 5vw;max-width:1150px;margin:auto}
h2{font-size:clamp(34px,6vw,54px);margin:0 0 8px;color:var(--yel)}
.sub{color:var(--mut);margin:0 0 30px}
.hero{min-height:86vh;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center;position:relative}
@media(max-width:800px){.hero{grid-template-columns:1fr;text-align:center}}
.hero h1{font-size:clamp(52px,10vw,110px);line-height:.95;margin:10px 0}
.hero h1 span{color:var(--red);display:inline-block}
.pill{display:inline-block;background:#e63a1e22;border:1px solid var(--red);padding:6px 14px;border-radius:30px;font-size:13px}
.cta{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}@media(max-width:800px){.cta{justify-content:center}}
.btn{background:var(--red);color:#fff;padding:14px 26px;border-radius:40px;font-weight:700;font-size:16px;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;border:2px solid var(--yel);color:var(--yel)}
.plate{position:relative;height:380px;display:grid;place-items:center}
.plate .big{font-size:190px;filter:drop-shadow(0 20px 30px #000)}
.plate .ring{position:absolute;width:320px;height:320px;border-radius:50%;border:3px dashed var(--yel);opacity:.4}
.fl{position:absolute;font-size:48px}
.marq{background:var(--red);overflow:hidden;white-space:nowrap;padding:12px 0;transform:rotate(-1.2deg);margin:10px -2vw}
.marq div{display:inline-block;font-family:Bangers;font-size:26px;letter-spacing:2px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px}
.tab{background:var(--card);color:var(--txt);padding:10px 18px;border-radius:30px;border:1px solid #ffffff1f;position:relative}
.tab.on{background:var(--yel);color:#000;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.item{background:var(--card);border-radius:20px;padding:20px;border:1px solid #ffffff14}
.item .em{font-size:64px;text-align:center;margin-bottom:6px}
.item h3{margin:4px 0;font-size:18px}.item p{margin:0 0 12px;color:var(--mut);font-size:13px;min-height:36px}
.row{display:flex;justify-content:space-between;align-items:center}.price{color:var(--yel);font-weight:700}
.add{background:var(--red);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.branches{grid-template-columns:1fr}}
.br{background:var(--card);border-radius:22px;padding:26px;border:2px solid #ffffff14}
.br.on{border-color:var(--yel)}.br h3{margin:0 0 6px;font-size:22px}.br p{margin:4px 0;color:var(--mut);font-size:14px}
.br a{color:var(--yel)}
.rev{background:var(--card);border-radius:22px;padding:30px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.rev q{font-size:20px;display:block;max-width:560px}.stars{color:var(--yel);font-size:24px;letter-spacing:4px}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}.dot{width:10px;height:10px;border-radius:50%;background:#ffffff33;padding:0}.dot.on{background:var(--yel)}
.score{display:flex;gap:30px;flex-wrap:wrap;margin-bottom:22px}.score b{font-family:Bangers;font-size:44px;color:var(--red);display:block;line-height:1}
form{display:grid;gap:12px;max-width:560px}
input,textarea,select{background:var(--card);border:1px solid #ffffff22;color:var(--txt);padding:14px;border-radius:14px;font:inherit;width:100%}
.ov{position:fixed;inset:0;background:#000a;z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#1b100c;z-index:31;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.ci{display:flex;gap:10px;align-items:center;background:var(--card);padding:10px 12px;border-radius:14px}
.ci .n{flex:1;font-size:14px}.q{display:flex;gap:8px;align-items:center}.q button{width:28px;height:28px;border-radius:50%;background:#ffffff22;color:#fff}
.wa{background:#25d366;color:#04200f;padding:15px;border-radius:40px;font-weight:700;font-size:16px;width:100%}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;background:#25d366;color:#04200f;width:58px;height:58px;border-radius:50%;font-size:28px;display:grid;place-items:center;text-decoration:none;box-shadow:0 6px 20px #000a}
.toast{position:fixed;left:50%;bottom:90px;z-index:40;background:var(--yel);color:#000;padding:10px 20px;border-radius:30px;font-weight:700}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.vid{position:relative;display:block;aspect-ratio:9/12;border-radius:22px;overflow:hidden;text-decoration:none;color:#fff;background:linear-gradient(160deg,#e63a1e,#7a1b0c 60%,#2a110a);display:flex;flex-direction:column;justify-content:flex-end;padding:20px;border:1px solid #ffffff1f}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vid .bg{position:absolute;inset:0;display:grid;place-items:center;font-size:120px;opacity:.35}
.vid .play{position:absolute;top:50%;left:50%;margin:-34px;width:68px;height:68px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;font-size:28px;padding-left:5px}
.vid h3{margin:0;position:relative;font-size:18px}.vid small{position:relative;color:#ffe3c2}
footer{text-align:center;color:var(--mut);padding:40px 5vw 90px;font-size:13px}
</style></head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/framer-motion@10.18.0/dist/framer-motion.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect}=React;
const FM=window.Motion||window.FramerMotion||{};
const {motion,AnimatePresence,useScroll,useSpring}=FM;
const BR=[
 {id:"west",name:"Kotli Loharan West",addr:"Main Bazar, near MCB Bank",hrs:"Open 24 hours",wa:"923320429608",ph:"0332 0429608"},
 {id:"east",name:"Kotli Loharan East",addr:"Main Bazar, near old UPL Bank",hrs:"Family & friends gatherings",wa:"923291602989",ph:"0329 1602989"}];
const CATS=["Pizza","Burgers","Shawarma","Sides"];
const MENU=[
 {c:"Pizza",e:"🍕",n:"Fajita Pizza",d:"Smoky chicken fajita, loaded cheese",p:650},
 {c:"Pizza",e:"🍕",n:"Tikka Pizza",d:"Spicy tikka chunks, desi style",p:700},
 {c:"Pizza",e:"🧀",n:"Cheese Lover",d:"Triple cheese, golden crust",p:600},
 {c:"Burgers",e:"🍔",n:"Zinger Burger",d:"Crispy zinger fillet, sauce, lettuce",p:350},
 {c:"Burgers",e:"🍔",n:"Double Patty Burger",d:"Two patties, double cheese",p:480},
 {c:"Shawarma",e:"🌯",n:"Matka Shawarma",d:"Our signature, served in a matka",p:300},
 {c:"Shawarma",e:"🌯",n:"Patka Pizza Shawarma",d:"Shawarma meets pizza",p:380},
 {c:"Shawarma",e:"🥙",n:"Open Shawarma",d:"Loaded open-style platter",p:420},
 {c:"Sides",e:"🍟",n:"Hamid Fries",d:"Masala fries, our house favourite",p:200},
 {c:"Sides",e:"🫓",n:"Paratha Roll",d:"Crispy paratha, juicy filling",p:250},
 {c:"Sides",e:"🍢",n:"Bar-B-Que",d:"Fresh grilled BBQ, ask for today’s cut",p:450}];
const REV=[
 {n:"Ali R.",t:"Best zinger burger in Kotli Loharan. Crispy and always fresh!"},
 {n:"Hina S.",t:"Matka shawarma is unique, nothing like it in Sialkot. Delivery was quick."},
 {n:"Usman K.",t:"Open 24 hours and the pizza is great at 2 AM. Lifesaver!"},
 {n:"Zara M.",t:"Took the family to the East branch, great place and friendly staff."}];
/* Add a real clip by setting src to a small .mp4 data URI or hosted file */
const VIDEOS=[
 {t:"2nd Branch Launch – Kotli Loharan East",s:"Facebook video",e:"🎉",u:"https://www.facebook.com/TasteInnSialkot/videos/taste-inn-2nd-branch-kotli-loharan-east-for-order-0329-1602989-kotliloharan/2069287100350283/"},
 {t:"Matka Shawarma – Our Signature",s:"Facebook post",e:"🌯",u:"https://www.facebook.com/TasteInnSialkot/posts/1767135262089182/"},
 {t:"New Branch on TikTok",s:"TikTok",e:"🔥",u:"https://www.tiktok.com/discover/taste-inn-shop-kotli-loharan-east-new-branch"},
 {t:"More on Facebook",s:"@TasteInnSialkot",e:"🍕",u:"https://www.facebook.com/TasteInnSialkot/"}];
const rs=n=>"Rs "+n.toLocaleString();
const FoodEm=["🍕","🍔","🌯","🍟"];

function App(){
 const [cat,setCat]=useState("Pizza");
 const [cart,setCart]=useState({});
 const [open,setOpen]=useState(false);
 const [br,setBr]=useState(BR[0]);
 const [ri,setRi]=useState(0);
 const [toast,setToast]=useState("");
 const [cust,setCust]=useState({name:"",addr:""});
 const {scrollYProgress}=useScroll();
 const sx=useSpring(scrollYProgress,{stiffness:120,damping:20});
 useEffect(()=>{const t=setInterval(()=>setRi(i=>(i+1)%REV.length),4500);return()=>clearInterval(t)},[]);
 const add=it=>{setCart(c=>({...c,[it.n]:(c[it.n]||0)+1}));setToast(it.e+" "+it.n+" added!");setTimeout(()=>setToast(""),1400)};
 const chg=(n,d)=>setCart(c=>{const v=(c[n]||0)+d;const x={...c};if(v<=0)delete x[n];else x[n]=v;return x});
 const lines=Object.entries(cart).map(([n,q])=>({...MENU.find(m=>m.n===n),q}));
 const count=lines.reduce((a,l)=>a+l.q,0),total=lines.reduce((a,l)=>a+l.q*l.p,0);
 const send=()=>{
  const m="*New Order – TasteInn*%0A"+lines.map(l=>l.q+" x "+l.n+" = "+rs(l.q*l.p)).join("%0A")+"%0A*Total: "+rs(total)+"*%0ABranch: "+br.name+"%0AName: "+encodeURIComponent(cust.name||"-")+"%0AAddress: "+encodeURIComponent(cust.addr||"-");
  window.open("https://wa.me/"+br.wa+"?text="+m.replace(/ /g,"%20"),"_blank");
 };
 const [msg,setMsg]=useState({n:"",m:""});
 const fade={initial:{opacity:0,y:40},whileInView:{opacity:1,y:0},viewport:{once:true,margin:"-60px"},transition:{duration:.6}};
 return(<>
 <motion.div style={{scaleX:sx,transformOrigin:"0 0",position:"fixed",top:0,left:0,right:0,height:4,background:"var(--yel)",zIndex:50}}/>
 <nav><div className="logo">Taste<b>Inn</b></div>
  <div className="links"><a href="#menu">Menu</a><a href="#watch">Videos</a><a href="#branches">Branches</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a>
  <motion.button className="cartbtn" whileTap={{scale:.9}} onClick={()=>setOpen(true)}>🛒 Cart <motion.span key={count} initial={{scale:1.8}} animate={{scale:1}}>({count})</motion.span></motion.button></div></nav>

 <section className="hero">
  <div>
   <motion.span className="pill" initial={{opacity:0,x:-30}} animate={{opacity:1,x:0}}>📍 Kotli Loharan, Sialkot · 2 branches · Free home delivery</motion.span>
   <h1>{["Taste","the"].map((w,i)=><motion.span key={w} style={{marginRight:14,color:"var(--txt)"}} initial={{y:80,opacity:0}} animate={{y:0,opacity:1}} transition={{delay:.1+i*.15,type:"spring"}}>{w}</motion.span>)}
    <motion.span initial={{scale:0,rotate:-20}} animate={{scale:1,rotate:-3}} transition={{delay:.5,type:"spring",stiffness:200}}>Fire!</motion.span></h1>
   <motion.p initial={{opacity:0}} animate={{opacity:1}} transition={{delay:.8}} style={{color:"var(--mut)",fontSize:18,maxWidth:480}}>Pizzas, zinger burgers and our famous Matka Shawarma. Order online in seconds, delivered hot to your door.</motion.p>
   <div className="cta"><motion.a href="#menu" className="btn" whileHover={{scale:1.08,rotate:-2}} whileTap={{scale:.95}}>Order Now 🔥</motion.a>
   <motion.a href={"https://wa.me/"+BR[0].wa} className="btn alt" whileHover={{scale:1.08}} whileTap={{scale:.95}}>WhatsApp Us</motion.a></div>
  </div>
  <div className="plate">
   <motion.div className="ring" animate={{rotate:360}} transition={{repeat:Infinity,duration:25,ease:"linear"}}/>
   <motion.div className="big" drag dragConstraints={{left:-40,right:40,top:-40,bottom:40}} dragElastic={.4} whileTap={{scale:.9}} animate={{y:[0,-18,0],rotate:[0,6,-6,0]}} transition={{repeat:Infinity,duration:5}}>🍕</motion.div>
   {FoodEm.map((e,i)=><motion.span key={i} className="fl" style={{top:[10,60,250,300][i]+"px",left:["8%","80%","2%","75%"][i]}} animate={{y:[0,-20,0],rotate:[0,15,0]}} transition={{repeat:Infinity,duration:3+i,delay:i*.4}}>{e}</motion.span>)}
  </div>
 </section>

 <div className="marq"><motion.div animate={{x:["0%","-50%"]}} transition={{repeat:Infinity,duration:22,ease:"linear"}}>{Array(12).fill("🍕 PIZZA  ✦  🍔 ZINGER  ✦  🌯 MATKA SHAWARMA  ✦  🍟 HAMID FRIES  ✦  ").join("")}</motion.div></div>

 <section id="menu"><motion.div {...fade}><h2>Our Menu</h2><p className="sub">Tap + to add to your cart. (Sample prices; edit to match the real menu.)</p></motion.div>
  <div className="tabs">{CATS.map(c=><button key={c} className={"tab"+(cat===c?" on":"")} onClick={()=>setCat(c)}>{cat===c&&<motion.span layoutId="tb" style={{position:"absolute",inset:0,background:"var(--yel)",borderRadius:30,zIndex:-1}}/>}{c}</button>)}</div>
  <motion.div className="grid" layout><AnimatePresence mode="popLayout">
   {MENU.filter(m=>m.c===cat).map(it=><motion.div layout key={it.n} className="item" initial={{opacity:0,scale:.8}} animate={{opacity:1,scale:1}} exit={{opacity:0,scale:.8}} whileHover={{y:-8,rotate:-1}}>
    <motion.div className="em" whileHover={{scale:1.3,rotate:15}}>{it.e}</motion.div><h3>{it.n}</h3><p>{it.d}</p>
    <div className="row"><span className="price">{rs(it.p)}</span><motion.button className="add" whileTap={{scale:.7,rotate:90}} whileHover={{scale:1.15}} onClick={()=>add(it)}>+</motion.button></div></motion.div>)}
  </AnimatePresence></motion.div></section>

 <section id="watch"><motion.div {...fade}><h2>Watch TasteInn in Action</h2><p className="sub">Real videos from our Facebook and TikTok pages.</p></motion.div>
  <div className="vgrid">{VIDEOS.map((v,i)=><motion.a key={i} className="vid" href={v.u} target="_blank" rel="noopener" {...fade} whileHover={{y:-8,scale:1.02}}>
   {v.src?<video src={v.src} muted loop playsInline autoPlay/>:<motion.div className="bg" animate={{scale:[1,1.15,1],rotate:[0,6,-6,0]}} transition={{repeat:Infinity,duration:6}}>{v.e}</motion.div>}
   <motion.div className="play" animate={{scale:[1,1.15,1]}} transition={{repeat:Infinity,duration:1.8}}>▶</motion.div>
   <h3>{v.t}</h3><small>{v.s} ↗</small></motion.a>)}</div></section>

 <section id="branches"><motion.div {...fade}><h2>Two Branches, One Taste</h2><p className="sub">Pick your branch. Your cart order goes straight to it on WhatsApp.</p></motion.div>
  <div className="branches">{BR.map(b=><motion.div key={b.id} {...fade} whileHover={{y:-6}} className={"br"+(br.id===b.id?" on":"")}>
   <h3>📍 {b.name}</h3><p>{b.addr}</p><p>🕒 {b.hrs}</p><p>📞 <a href={"tel:+"+b.wa}>{b.ph}</a></p>
   <motion.button className="btn" style={{marginTop:12,background:br.id===b.id?"var(--yel)":"var(--red)",color:br.id===b.id?"#000":"#fff"}} whileTap={{scale:.93}} onClick={()=>setBr(b)}>{br.id===b.id?"✓ Selected for orders":"Order from here"}</motion.button></motion.div>)}</div></section>

 <section id="reviews"><motion.div {...fade}><h2>Loved by Sialkot</h2></motion.div>
  <div className="score"><div><b>4.1★</b>Google rating</div><div><b>73+</b>Google reviews</div><div><b>24/7</b>West branch</div></div>
  <div className="rev"><AnimatePresence mode="wait"><motion.div key={ri} initial={{opacity:0,x:60}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-60}}><div className="stars">★★★★★</div><q>{REV[ri].t}</q><p style={{color:"var(--yel)"}}>– {REV[ri].n}</p></motion.div></AnimatePresence></div>
  <div className="dots">{REV.map((_,i)=><button key={i} aria-label={"review "+(i+1)} className={"dot"+(i===ri?" on":"")} onClick={()=>setRi(i)}/>)}</div></section>

 <section id="contact"><motion.div {...fade}><h2>Say Hello</h2><p className="sub">Catering, parties, feedback? Message goes to WhatsApp.</p></motion.div>
  <form onSubmit={e=>{e.preventDefault();window.open("https://wa.me/"+br.wa+"?text="+encodeURIComponent("Hi TasteInn, I'm "+msg.n+". "+msg.m),"_blank")}}>
   <input required placeholder="Your name" value={msg.n} onChange={e=>setMsg({...msg,n:e.target.value})}/>
   <textarea required rows="4" placeholder="Your message" value={msg.m} onChange={e=>setMsg({...msg,m:e.target.value})}/>
   <motion.button className="btn" whileHover={{scale:1.04}} whileTap={{scale:.95}}>Send on WhatsApp 💬</motion.button></form></section>

 <footer><div className="logo">Taste<b>Inn</b></div>Main Bazar, Kotli Loharan, Sialkot · 0304 1280559<br/>© TasteInn. Website concept demo.</footer>

 <motion.a className="fab" href={"https://wa.me/"+br.wa} aria-label="WhatsApp" animate={{scale:[1,1.12,1]}} transition={{repeat:Infinity,duration:2}}>💬</motion.a>
 <AnimatePresence>{toast&&<motion.div className="toast" initial={{y:40,opacity:0}} animate={{y:0,opacity:1}} exit={{opacity:0}}>{toast}</motion.div>}</AnimatePresence>

 <AnimatePresence>{open&&<>
  <motion.div className="ov" initial={{opacity:0}} animate={{opacity:1}} exit={{opacity:0}} onClick={()=>setOpen(false)}/>
  <motion.div className="drawer" initial={{x:"100%"}} animate={{x:0}} exit={{x:"100%"}} transition={{type:"spring",damping:28,stiffness:260}}>
   <div className="row"><h2 style={{margin:0}}>Your Cart</h2><button onClick={()=>setOpen(false)} style={{background:"none",color:"#fff",fontSize:26}}>✕</button></div>
   {!lines.length&&<p className="sub">Your cart is empty. Add something tasty 🍕</p>}
   <AnimatePresence>{lines.map(l=><motion.div layout key={l.n} className="ci" initial={{opacity:0,x:40}} animate={{opacity:1,x:0}} exit={{opacity:0,x:-40}}>
    <span style={{fontSize:30}}>{l.e}</span><div className="n">{l.n}<br/><span className="price">{rs(l.p*l.q)}</span></div>
    <div className="q"><button onClick={()=>chg(l.n,-1)}>−</button>{l.q}<button onClick={()=>chg(l.n,1)}>+</button></div></motion.div>)}</AnimatePresence>
   {!!lines.length&&<>
    <select value={br.id} onChange={e=>setBr(BR.find(b=>b.id===e.target.value))}>{BR.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select>
    <input placeholder="Your name" value={cust.name} onChange={e=>setCust({...cust,name:e.target.value})}/>
    <input placeholder="Delivery address" value={cust.addr} onChange={e=>setCust({...cust,addr:e.target.value})}/>
    <div className="row" style={{fontSize:20}}><b>Total</b><b className="price">{rs(total)}</b></div>
    <motion.button className="wa" whileHover={{scale:1.03}} whileTap={{scale:.96}} onClick={send}>Order on WhatsApp 💬</motion.button></>}
  </motion.div></>}</AnimatePresence>
 </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
